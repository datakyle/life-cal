<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life in Weeks</title>
<meta name="description" content="Visualize your life in weeks. Every row is a year, every square is a week.">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Weeks">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#fafaf9; --panel:#ffffff; --ink:#1c1917; --muted:#78716c; --line:#e7e5e4;
  --lived:#d6d3d1; --cell-border:#d6d3d1; --accent:#1c1917; --now:#ef4444; --danger:#dc2626;
  --cell:12px; --gap:2px; --lw:120px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0a09; --panel:#1c1917; --ink:#f5f5f4; --muted:#a8a29e; --line:#292524;
    --lived:#44403c; --cell-border:#3f3a36; --accent:#f5f5f4;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
button.ghost{border-color:transparent;background:transparent}
button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
input[type=text],input[type=date],input[type=number],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.logo{display:grid;grid-template-columns:repeat(3,5px);gap:2px}
.logo i{width:5px;height:5px;border-radius:1px;background:var(--ink)}
.logo i:nth-child(n+5){background:transparent;outline:1px solid var(--muted);outline-offset:-1px}
.actions{display:flex;gap:6px;flex-wrap:wrap}

.banner{padding:10px 16px;background:#fef3c7;color:#78350f;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner button{background:#fff;color:#78350f}

main{max-width:1100px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;max-width:1100px;margin:0 auto}
.tab{white-space:nowrap;display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}

.cal-header{text-align:center;margin:8px 0 14px}
.cal-header h1{margin:0;font-size:22px;letter-spacing:.18em;text-transform:uppercase}
.sub{margin:4px 0 0;color:var(--muted);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.stats{margin:6px 0 0;font-size:13px;color:var(--muted)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .sp{flex:1}
.toolbar label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.hint{font-size:13px;color:var(--muted)}

.event-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px}
.chip span{color:var(--muted)}

.grid-wrap{overflow-x:auto;padding:4px 0 12px}
.grid{display:grid;grid-template-columns:var(--lw) 24px repeat(52,var(--cell));gap:var(--gap);align-items:center;width:max-content;margin:0 auto}
.wk,.yr,.lbl{font-size:max(7px,min(10px,calc(var(--cell) * .8)));color:var(--muted);height:var(--cell);line-height:var(--cell);white-space:nowrap}
.wk{text-align:center;overflow:visible}
.yr{text-align:right;padding-right:4px;font-variant-numeric:tabular-nums}
.lbl{text-align:right;overflow:visible;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);direction:rtl}
.lbl span{direction:ltr;unicode-bidi:isolate}
.lbl i{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 4px;vertical-align:middle}
.c{width:var(--cell);height:var(--cell);border:1px solid var(--cell-border);border-radius:2px;cursor:pointer;transition:transform .08s}
.c.p{background:var(--lived);border-color:var(--lived)}
.c.f{background:var(--ev);border-color:transparent}
.c.now{outline:2px solid var(--now);outline-offset:1px}
.c.sel{outline:2px solid var(--accent);outline-offset:1px}
.c.m{position:relative}
.c.m::after{content:"";position:absolute;inset:18%;border-radius:50%;background:var(--mk);box-shadow:0 0 0 1.5px var(--panel)}
.c.rng{outline:2px solid var(--accent);outline-offset:0;box-shadow:inset 0 0 0 99px color-mix(in srgb,var(--accent) 30%,transparent)}
.grid.dragging{cursor:crosshair;user-select:none;-webkit-user-select:none}
.grid.dragging .c:hover{transform:none}
.dot.ms,.lbl i.ms{border-radius:2px;transform:rotate(45deg) scale(.85)}
.drag-tip{position:fixed;z-index:8;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(12px,12px)}
.kind{margin-top:12px}
.brand{flex-wrap:wrap}
.save-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin-left:6px;letter-spacing:0}
.save-pill[hidden]{display:none}
.save-pill i{width:7px;height:7px;border-radius:50%;background:#16a34a}
.save-pill.ok{color:var(--muted)}
.save-pill.warn{color:#92400e;background:#fef3c7;border-color:#fcd34d}
.save-pill.warn i{background:#f59e0b}
.save-pill.bad{color:#991b1b;background:#fee2e2;border-color:#fca5a5}
.save-pill.bad i{background:#dc2626}
dialog h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:20px 0 4px}
.sv-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sv-row .grow{flex:1;min-width:0}
.sv-row .muted{font-size:13px}
.sv-row:first-of-type{border-top:none}
.sv-dot{width:10px;height:10px;border-radius:50%;flex:none;background:#16a34a}
.sv-dot.bad{background:#dc2626}
.ok-txt{color:#16a34a;font-weight:600}
.note{font-size:13px;background:#fef3c7;color:#78350f;border-radius:10px;padding:10px 12px;margin:12px 0 0}
.snap-list{max-height:260px;overflow:auto}
button.link{border:none;background:none;padding:0;text-decoration:underline;color:var(--ink);font-size:inherit}
.c:hover{transform:scale(1.7);position:relative;z-index:2}
.view-only .c{cursor:default}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:16px}

.empty{max-width:440px;margin:48px auto;text-align:center}
.empty .btns{justify-content:center}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:20px;width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 4px;font-size:18px}
dialog label{display:block;margin:12px 0 0;font-size:13px;color:var(--muted)}
dialog label > input,dialog label > select{margin-top:4px;color:var(--ink)}
dialog label.check{display:flex;gap:8px;align-items:center;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.btns .sp{flex:1}
.muted{color:var(--muted)}
.err{color:var(--danger);font-size:13px;min-height:1em;margin:8px 0 0}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sw{position:relative;margin:0!important}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:block;width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--panel)}
.sw input:checked + span{border-color:var(--ink)}
.sw input:focus-visible + span{outline:2px solid var(--accent)}
.sw.custom{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:12px}
.sw.custom input[type=color]{position:static;opacity:1;pointer-events:auto;width:30px;height:26px;padding:0;border:none;background:none}
.ev-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.ev-row .grow{flex:1}
textarea{width:100%;min-height:90px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:12px ui-monospace,monospace;color:var(--ink)}

/* ---------- progress, menu, fab ---------- */
.progress{height:6px;max-width:320px;margin:10px auto 0;border-radius:999px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:999px}
.only-mobile{display:none}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;font-size:30px;line-height:1;padding:0;z-index:6;align-items:center;justify-content:center;
  background:var(--accent);color:var(--bg);border:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fab[hidden]{display:none}
.menu-list{display:flex;flex-direction:column;margin-top:8px}
.menu-list button{display:flex;align-items:center;gap:12px;text-align:left;border:none;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:14px 4px;font-size:16px}
.menu-list button:first-child{border-top:none}
.menu-list small{display:block;color:var(--muted);font-size:13px}
.menu-list .ico{width:28px;text-align:center;font-size:18px}
.nav-week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.nav-week button{padding:8px 0;font-size:13px}

/* ---------- wallpaper ---------- */
.wp-wrap{display:grid;grid-template-columns:1fr 200px;gap:16px;align-items:start}
.wp-preview{position:sticky;top:0;text-align:center}
.wp-preview img{width:100%;border-radius:22px;border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.18);display:block;background:var(--line);aspect-ratio:var(--ar,9/19.5)}
.wp-preview p{font-size:12px;color:var(--muted);margin:8px 0 0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px}
.seg label{flex:1;margin:0!important;text-align:center;position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:8px 4px;font-size:13px;color:var(--ink)}
.seg input:checked + span{background:var(--accent);color:var(--bg)}
.theme-row{display:flex;gap:8px;margin-top:6px}
.theme-row label{margin:0!important;position:relative}
.theme-row input{position:absolute;opacity:0}
.theme-row span{display:block;width:44px;height:44px;border-radius:12px;border:2px solid var(--line)}
.theme-row input:checked + span{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
dialog.wide{width:min(720px,calc(100vw - 32px))}

@media (hover:none){ .c:hover{transform:none} }

@media (max-width:640px){
  :root{--lw:64px}
  body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .top{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
  .only-desktop{display:none!important}
  .top{flex-wrap:nowrap;gap:8px}
  .brand{white-space:nowrap;flex-wrap:nowrap;min-width:0}
  .save-pill{margin-left:2px;padding:3px 8px}
  .save-pill.ok span{display:none}
  .save-pill.ok{padding:6px}
  .actions{flex-wrap:nowrap}
  .only-mobile{display:inline-flex}
  main{padding:12px 12px 96px}
  .tabs{padding:10px 12px 0}
  .tab{min-height:40px;padding:8px 14px}
  .cal-header h1{font-size:18px}
  .event-list{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -12px 12px;padding:0 12px 4px;-webkit-overflow-scrolling:touch}
  .chip{flex:none;scroll-snap-align:start;min-height:38px}
  .toolbar button{min-height:40px}
  .toolbar label{width:100%}
  .toolbar label input{flex:1}
  input[type=text],input[type=date],input[type=number],select,textarea{font-size:16px}
  dialog,dialog.wide{margin:auto 0 0;width:100vw;max-width:100vw;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;border-bottom:none;
    padding:22px 16px calc(20px + env(safe-area-inset-bottom));animation:sheet .22s ease-out}
  dialog::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:-10px auto 14px}
  .btns button{min-height:44px;flex:1}
  .btns .sp{display:none}
  .wp-wrap{grid-template-columns:1fr}
  .wp-preview{position:static;order:-1}
  .wp-preview img{width:min(180px,48vw);margin:0 auto}
}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

@media print{
  @page{size:letter portrait;margin:.4in}
  :root,:root:not([data-theme="light"]){--bg:#fff;--panel:#fff;--ink:#111;--muted:#666;--lived:#d4d4d4;--cell-border:#bbb}
  .no-print{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  #grid{--cell:9px !important;--gap:1px !important;--lw:110px !important}
  .grid-wrap{overflow:visible}
  .c{border-width:.5px}
  .c.now{outline-width:1px}
  .c:hover{transform:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top no-print">
  <div class="brand"><span class="logo"><i></i><i></i><i></i><i></i><i></i><i></i></span>Life in Weeks
    <button type="button" id="saveStatus" class="save-pill ok" hidden aria-label="Saving and backups"></button></div>
  <div class="actions">
    <button id="btnWallpaper" type="button">Wallpaper</button>
    <button id="btnImport" type="button" class="only-desktop">Import</button>
    <button id="btnExport" type="button" class="only-desktop">Export</button>
    <button id="btnShare" type="button" class="only-desktop">Share</button>
    <button id="btnPrint" type="button" class="only-desktop">Print</button>
    <button id="btnSettings" type="button" class="only-desktop">Settings</button>
    <button id="btnMenu" type="button" class="only-mobile" aria-label="More">•••</button>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</header>
<div id="banner" class="banner no-print" hidden></div>
<div id="storageWarn" class="banner no-print" hidden>
  This browser isn't saving your changes (private mode or storage blocked). Use Export to keep a backup.
</div>
<nav id="tabs" class="tabs no-print"></nav>
<main id="main">
  <section id="calHeader" class="cal-header"></section>
  <section id="toolbar" class="toolbar no-print"></section>
  <section id="eventList" class="event-list no-print"></section>
  <div class="grid-wrap" id="gridWrap"><div id="grid" class="grid"></div></div>
  <p class="foot no-print">Your data stays in this browser. Export a backup now and then.</p>
</main>
<button id="fab" class="fab no-print only-mobile" type="button" aria-label="Add event" data-act="newev" hidden>+</button>
<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
"use strict";
/* ==================================================================
   Life in Weeks: an open-source life calendar.
   Data format is compatible with lifecalendar.io JSON backups.
   ================================================================== */

const STORAGE_KEY = "life-in-weeks:data:v1";
const ZOOM_KEY = "life-in-weeks:zoom";
const DAY = 86400000;
const WEEKS = 52;

const PRESETS = {
  slate:"#64748b", gray:"#6b7280", zinc:"#71717a", neutral:"#737373", stone:"#78716c",
  red:"#ef4444", orange:"#f97316", amber:"#f59e0b", yellow:"#eab308", lime:"#84cc16",
  green:"#22c55e", emerald:"#10b981", teal:"#14b8a6", cyan:"#06b6d4", sky:"#0ea5e9",
  blue:"#3b82f6", indigo:"#6366f1", violet:"#8b5cf6", purple:"#a855f7", fuchsia:"#d946ef",
  pink:"#ec4899", rose:"#f43f5e"
};
const SWATCH_ORDER = ["orange","amber","yellow","lime","green","teal","cyan","sky","blue",
  "indigo","violet","purple","pink","rose","red","slate","stone"];

const SAMPLE = {
  format:"lifecalendar.io", version:1,
  preferences:{ birthdate:"1995-06-12", timezone:"America/Chicago", displayPrecision:"week" },
  calendars:[
    { calendar:{ name:"Where I have lived", color:{kind:"preset",name:"slate"}, length:90, startDate:"1995-06-12" },
      events:[
        { name:"Ohio", startDate:"1995-06-12", endDate:"2013-08-15", color:{kind:"preset",name:"orange"} },
        { name:"Chicago", startDate:"2013-08-16", endDate:"2019-05-31", color:{kind:"preset",name:"sky"} },
        { name:"Denver", startDate:"2019-06-01", color:{kind:"preset",name:"green"} }
      ]},
    { calendar:{ name:"Work", color:{kind:"preset",name:"stone"}, length:90, startDate:"1995-06-12" },
      events:[
        { name:"Barista", startDate:"2011-06-01", endDate:"2013-08-01", color:{kind:"preset",name:"amber"} },
        { name:"Analyst, Acme Co", startDate:"2017-06-05", endDate:"2021-02-26", color:{kind:"preset",name:"indigo"} },
        { name:"Product Manager", startDate:"2021-03-01", color:{kind:"preset",name:"violet"} }
      ]}
  ]
};

/* ---------- state ---------- */
const state = {
  data: null,          // lifecalendar.io-shaped object
  active: 0,           // index of active calendar
  viewOnly: false,     // true when viewing a shared link
  rangeMode: false,
  rangeStart: null,
  paint: null,         // cache from last grid render
  zoom: null           // null = auto
};

/* ---------- tiny helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
function newId(){
  const b = new Uint8Array(12); crypto.getRandomValues(b);
  return [...b].map(x => x.toString(16).padStart(2,"0")).join("");
}
function clampInt(v, lo, hi, dflt){ const n = parseInt(v,10); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : dflt; }
function defaultTZ(){ try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return "UTC"; } }
function colorHex(c){
  if (!c) return PRESETS.slate;
  if (PRESETS[c.name]) return PRESETS[c.name];
  const h = c.hex || c.value;
  return (typeof h === "string" && /^#[0-9a-f]{6}$/i.test(h)) ? h : PRESETS.slate;
}

/* ---------- dates (all math in UTC day numbers, no DST surprises) ---------- */
function isISO(s){
  if (typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y,m,d] = s.split("-").map(Number);
  const t = new Date(Date.UTC(y, m-1, d));
  return t.getUTCFullYear() === y && t.getUTCMonth() === m-1 && t.getUTCDate() === d;
}
function dn(s){ const [y,m,d] = s.split("-").map(Number); return Date.UTC(y, m-1, d) / DAY; }
function iso(n){ return new Date(n*DAY).toISOString().slice(0,10); }
function nice(n){ return new Date(n*DAY).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}); }
function monthYr(n){ return new Date(n*DAY).toLocaleDateString(undefined,{month:"short",year:"numeric",timeZone:"UTC"}); }
function today(){
  const tz = state.data?.preferences?.timezone;
  try {
    return dn(new Intl.DateTimeFormat("en-CA",{timeZone:tz||undefined,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()));
  } catch {
    return dn(new Date().toISOString().slice(0,10));
  }
}
function birthParts(s){ const [y,m,d] = s.split("-").map(Number); return {y,m,d}; }
function anniv(b, n){ return Date.UTC(b.y + n, b.m - 1, b.d) / DAY; }

/* A row is one year of age (birthday to birthday). A column is a week within that year.
   Week 52 absorbs the 1 or 2 leftover days so every year has exactly 52 squares. */
function cellOf(day, b){
  let n = new Date(day*DAY).getUTCFullYear() - b.y;
  if (anniv(b, n) > day) n--;
  const w = Math.min(WEEKS - 1, Math.floor((day - anniv(b, n)) / 7));
  return { year:n, week:w, index:n*WEEKS + w };
}
function cellRange(year, week, b){
  const start = anniv(b, year) + 7*week;
  const end = week === WEEKS - 1 ? anniv(b, year + 1) - 1 : start + 6;
  return { start, end };
}

/* ---------- data shape ---------- */
// A milestone is a single moment (a wedding, a move-in day) shown as a dot on its week.
// Stored as an ordinary event with type "milestone" and no endDate.
const isMilestone = (e) => e && e.type === "milestone";
const dotCls = (e) => isMilestone(e) ? "dot ms" : "dot";
function eventWhen(e, fmt){
  if (isMilestone(e)) return fmt(dn(e.startDate));
  return `${fmt(dn(e.startDate))} – ${e.endDate ? fmt(dn(e.endDate)) : "now"}`;
}
function normalize(raw){
  if (!raw || !Array.isArray(raw.calendars)) throw new Error('This file does not look like a Life Calendar backup (no "calendars" list).');
  const prefs = Object.assign({ birthdate:null, timezone:defaultTZ(), displayPrecision:"week" }, raw.preferences || {});
  if (!isISO(prefs.birthdate)) prefs.birthdate = null;
  const calendars = raw.calendars.map(entry => {
    const cal = Object.assign({}, entry.calendar || {});
    cal.id = cal.id || newId();
    cal.name = cal.name || "Untitled";
    cal.length = clampInt(cal.length, 1, 120, 90);
    cal.color = cal.color || {kind:"preset", name:"slate"};
    if (cal.displayEventLabels === undefined) cal.displayEventLabels = true;
    if (cal.displayCalendarName === undefined) cal.displayCalendarName = true;
    const events = (entry.events || []).filter(e => e && isISO(e.startDate)).map(e => {
      const ev = Object.assign({}, e);
      ev.id = ev.id || newId();
      ev.name = ev.name || "Untitled";
      ev.calendar = cal.id;
      ev.color = ev.color || {kind:"preset", name:"slate"};
      if (!isISO(ev.endDate) || isMilestone(ev)) delete ev.endDate;
      return ev;
    });
    return { calendar:cal, events };
  });
  if (!prefs.birthdate) prefs.birthdate = calendars.map(c => c.calendar.startDate).filter(isISO).sort()[0] || null;
  if (!prefs.birthdate) throw new Error("The backup has no birthdate. Add one in Settings after creating a calendar.");
  calendars.forEach(c => { if (!isISO(c.calendar.startDate)) c.calendar.startDate = prefs.birthdate; });
  return {
    format: raw.format || "lifecalendar.io",
    version: raw.version || 1,
    exportedAt: raw.exportedAt || new Date().toISOString(),
    preferences: prefs,
    calendars
  };
}
function blankCalendar(name, colorName){
  const now = new Date().toISOString();
  return { calendar:{ id:newId(), name, color:{kind:"preset",name:colorName}, length:90,
    displayEventLabels:true, quote:{}, displayCalendarName:true, startDate:state.data.preferences.birthdate,
    access:{generalAccess:"restricted"}, createdAt:now, updatedAt:now }, events:[] };
}
const cal = () => state.data?.calendars[state.active];

function save(){
  if (state.viewOnly || !state.data) return;
  const json = JSON.stringify(state.data);
  const ok = store.set(STORAGE_KEY, json);
  $("storageWarn").hidden = ok;
  saver.afterSave(json, ok);
}
function commit(){ save(); render(); }

/* ---------- painting ---------- */
function paint(c){
  const b = birthParts(c.calendar.startDate);
  const total = c.calendar.length * WEEKS;
  const cells = new Array(total).fill(null);
  const starts = new Map();
  const t = today();
  const evs = [...c.events].sort((a,z) => a.startDate.localeCompare(z.startDate));
  const marks = new Array(total).fill(null);
  for (const e of evs){
    if (isMilestone(e)){
      const d = dn(e.startDate);
      if (d < anniv(b, 0)) continue;
      const i = cellOf(d, b).index;
      if (i >= total) continue;
      (marks[i] ||= []).push(e);
      const row = Math.floor(i / WEEKS);
      if (!starts.has(row)) starts.set(row, []);
      starts.get(row).push(e);
      continue;
    }
    const s = Math.max(dn(e.startDate), anniv(b, 0));
    const en = e.endDate ? dn(e.endDate) : Math.max(t, s);
    if (en < s) continue;
    const a = cellOf(s, b).index;
    if (a >= total) continue;
    const z = Math.min(total - 1, cellOf(en, b).index);
    for (let i = a; i <= z; i++) (cells[i] ||= []).push(e);
    const row = Math.floor(a / WEEKS);
    if (!starts.has(row)) starts.set(row, []);
    starts.get(row).push(e);
  }
  const nowIdx = t < anniv(b,0) ? -1 : cellOf(t, b).index;
  return { b, total, cells, marks, starts, nowIdx, today:t };
}

/* ---------- rendering ---------- */
function render(){
  document.body.classList.toggle("view-only", state.viewOnly);
  renderBanner();
  const has = state.data && state.data.calendars.length;
  $("btnExport").disabled = !state.data;
  $("btnShare").disabled = !has;
  $("btnPrint").disabled = !has;
  $("btnWallpaper").disabled = !has;
  $("btnImport").hidden = state.viewOnly;
  $("btnSettings").hidden = state.viewOnly;
  $("fab").hidden = !has || state.viewOnly;
  renderTabs();
  saver.renderStatus();
  if (!has){
    $("calHeader").innerHTML = ""; $("toolbar").innerHTML = ""; $("eventList").innerHTML = ""; $("grid").innerHTML = "";
    if (!state.data) renderEmpty();
    else $("calHeader").innerHTML = `<div class="empty"><p class="muted">No calendars yet.</p><div class="btns"><button class="primary" data-act="newcal" type="button">Create a calendar</button></div></div>`;
    return;
  }
  if (state.active >= state.data.calendars.length) state.active = 0;
  renderHeader(); renderToolbar(); renderEvents(); renderGrid();
}

function renderEmpty(){
  $("calHeader").innerHTML = `
    <div class="empty">
      <h1 style="letter-spacing:.05em;text-transform:none">Your life in weeks</h1>
      <p class="muted">Each row is a year of your life, each square a week. Fill the squares with the places, jobs and chapters that made you.</p>
      <div class="btns">
        <button class="primary" data-act="welcome" type="button">Get started</button>
        <button data-act="import" type="button">Import a backup</button>
        <button data-act="sample" type="button">See an example</button>
      </div>
    </div>`;
}

function renderBanner(){
  const el = $("banner");
  if (!state.viewOnly){ el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<span>You're viewing a shared life calendar.</span>
    <button data-act="keep" type="button">Save to my calendars</button>
    <button data-act="leave" type="button">Back to mine</button>`;
}

function renderTabs(){
  const cs = state.data?.calendars || [];
  $("tabs").innerHTML = cs.map((c,i) =>
    `<button type="button" class="tab ${i===state.active?"on":""}" data-tab="${i}"><i class="dot" style="background:${colorHex(c.calendar.color)}"></i>${esc(c.calendar.name)}</button>`
  ).join("") + (state.data && !state.viewOnly ? `<button type="button" class="tab ghost" data-act="newcal">+ Calendar</button>` : "");
}

function renderHeader(){
  const c = cal().calendar;
  const p = paint(cal());
  state.paint = p;
  const total = p.total;
  const lived = Math.max(0, Math.min(total, p.nowIdx + 1));
  const pct = total ? (lived / total * 100).toFixed(1) : 0;
  $("calHeader").innerHTML =
    (c.displayCalendarName !== false ? `<h1>${esc(c.name)}</h1>` : "") +
    `<p class="sub">${c.length}-year calendar · ${total.toLocaleString()} weeks total</p>` +
    (p.nowIdx >= 0 && p.nowIdx < total
      ? `<div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
         <p class="stats">Week ${lived.toLocaleString()} of ${total.toLocaleString()} · ${pct}% lived · ${(total-lived).toLocaleString()} to go</p>`
      : "");
}

function renderToolbar(){
  if (state.viewOnly){ $("toolbar").innerHTML = `<span class="hint">Tap any week to see what was happening.</span>`; return; }
  const rangeHint = !state.rangeMode ? "" :
    `<span class="hint">${state.rangeStart === null ? "Tap the first week" : "Now tap the last week"}</span>`;
  $("toolbar").innerHTML = `
    <button type="button" class="primary only-desktop" data-act="newev">+ Event</button>
    <button type="button" class="only-desktop" data-act="newms">+ Milestone</button>
    <button type="button" class="${state.rangeMode?"on":""}" data-act="range">${state.rangeMode ? "Cancel selecting" : "Select weeks"}</button>
    ${rangeHint || (canDrag() ? `<span class="hint only-desktop">Tip: drag across weeks to add a range</span>` : "")}
    <span class="sp"></span>
    <label>Zoom <input type="range" id="zoom" min="4" max="20" step="1" value="${state.zoom ?? autoCell()}"></label>
    <button type="button" data-act="editcal">Calendar settings</button>`;
}

function renderEvents(){
  const evs = [...cal().events].sort((a,z) => a.startDate.localeCompare(z.startDate));
  $("eventList").innerHTML = evs.map(e =>
    `<button type="button" class="chip" data-ev="${esc(e.id)}"><i class="${dotCls(e)}" style="background:${colorHex(e.color)}"></i><b>${esc(e.name)}</b><span>${eventWhen(e, isMilestone(e) ? nice : monthYr)}</span></button>`
  ).join("") || (state.viewOnly ? "" : `<span class="hint">No events yet. Add one, ${canDrag() ? "drag across weeks on the grid," : `or tap "Select weeks" and tap two squares,`} or add a milestone for a single moment.</span>`);
}

function autoCell(){
  const wrap = $("gridWrap").clientWidth || window.innerWidth;
  const lw = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--lw")) || 120;
  const gap = 2;
  const avail = wrap - lw - 24 - gap * 54;
  return Math.max(4, Math.min(16, Math.floor(avail / 52)));
}
function applyCell(){
  const size = state.zoom ?? autoCell();
  $("grid").style.setProperty("--cell", size + "px");
  $("grid").style.setProperty("--gap", (size < 8 ? 1 : 2) + "px");
  return size;
}

function renderGrid(){
  const c = cal().calendar, p = state.paint;
  const size = applyCell();
  const small = size < 10;
  const showLabels = c.displayEventLabels !== false;
  let h = `<div></div><div></div>`;
  for (let w = 1; w <= WEEKS; w++) h += `<div class="wk">${!small || w === 1 || w % 4 === 0 ? w : ""}</div>`;
  for (let row = 0; row < c.length; row++){
    const evs = showLabels ? (p.starts.get(row) || []) : [];
    const lbl = evs.map(e => `<span><i class="${isMilestone(e) ? "ms" : ""}" style="background:${colorHex(e.color)}"></i>${esc(e.name)}</span>`).join(" ");
    h += `<div class="lbl">${lbl}</div><div class="yr">${!small || size >= 7 || row % 5 === 0 ? row : ""}</div>`;
    for (let w = 0; w < WEEKS; w++){
      const i = row * WEEKS + w;
      const evs2 = p.cells[i];
      let cls = "c", style = "";
      if (evs2){
        cls += " f";
        const a = colorHex(evs2[evs2.length - 1].color);
        if (evs2.length > 1){
          const b = colorHex(evs2[0].color);
          style = ` style="--ev:${a};background:linear-gradient(135deg,${b} 50%,${a} 50%)"`;
        } else style = ` style="--ev:${a}"`;
      } else if (i < p.nowIdx) cls += " p";
      const mk = p.marks[i];
      if (mk){
        cls += " m";
        const dotStyle = `--mk:${colorHex(mk[mk.length - 1].color)}`;
        style = style ? style.replace('style="', `style="${dotStyle};`) : ` style="${dotStyle}"`;
      }
      if (i === p.nowIdx) cls += " now";
      if (i === state.rangeStart) cls += " sel";
      h += `<div class="${cls}" data-i="${i}"${style}></div>`;
    }
  }
  $("grid").innerHTML = h;
  state.cellEls = $("grid").querySelectorAll(".c");
}

/* ---------- dialogs ---------- */
const dlg = $("dlg");
function openDialog(html, bind, opts = {}){
  dlg.classList.toggle("wide", !!opts.wide);
  $("dlgBody").innerHTML = html;
  if (!dlg.open) dlg.showModal();
  bind && bind($("dlgBody"));
}
function closeDialog(){ if (dlg.open) dlg.close(); }
dlg.addEventListener("click", e => { if (e.target === dlg) closeDialog(); });

function swatchesHTML(color, includeCustom = true){
  const isPreset = color && PRESETS[color.name] && color.kind !== "custom";
  const customHex = !isPreset ? colorHex(color) : "#888888";
  return `<div class="swatches">` + SWATCH_ORDER.map(n =>
    `<label class="sw" title="${n}"><input type="radio" name="color" value="${n}" ${isPreset && color.name === n ? "checked" : ""}><span style="background:${PRESETS[n]}"></span></label>`
  ).join("") + (includeCustom ? `<label class="sw custom"><input type="radio" name="color" value="custom" ${!isPreset ? "checked" : ""}><input type="color" id="fCustom" value="${customHex}">Custom</label>` : "") + `</div>`;
}
function readColor(root){
  const v = root.querySelector('input[name=color]:checked')?.value || "slate";
  if (v === "custom") return { kind:"custom", hex: root.querySelector("#fCustom").value };
  return { kind:"preset", name:v };
}
function bindCustomPicker(root){
  const cp = root.querySelector("#fCustom");
  cp && cp.addEventListener("input", () => { root.querySelector('input[name=color][value=custom]').checked = true; });
}
function suggestColor(c){
  const used = new Set(c.events.map(e => e.color?.name));
  return SWATCH_ORDER.find(n => !used.has(n)) || "sky";
}

function openEventDialog(ev, preset = {}){
  const c = cal();
  const isNew = !ev;
  const e = ev || { name:"", startDate:preset.start || "", endDate:preset.end || "", color:{kind:"preset", name:suggestColor(c)},
    type: preset.milestone ? "milestone" : undefined };
  const ms = isMilestone(e);
  const ongoing = !isNew && !ms && !e.endDate;
  openDialog(`
    <h2 id="fTitle"></h2>
    <p class="muted" style="margin:0">in ${esc(c.calendar.name)}</p>
    <div class="seg kind" role="radiogroup" aria-label="Kind">
      <label><input type="radio" name="kind" value="range" ${ms ? "" : "checked"}><span>Range of weeks</span></label>
      <label><input type="radio" name="kind" value="milestone" ${ms ? "checked" : ""}><span>Milestone</span></label>
    </div>
    <label>Name<input type="text" id="fName" value="${esc(e.name)}"></label>
    <div class="row2">
      <label><span id="fStartLbl">Start</span><input type="date" id="fStart" value="${esc(e.startDate || "")}"></label>
      <label id="fEndWrap">End<input type="date" id="fEnd" value="${esc(e.endDate || "")}" ${ongoing ? "disabled" : ""}></label>
    </div>
    <label class="check" id="fOngoingWrap"><input type="checkbox" id="fOngoing" ${ongoing ? "checked" : ""}> Still going (fills up to this week)</label>
    <label>Color</label>${swatchesHTML(e.color)}
    <p class="err" id="fErr"></p>
    <div class="btns">
      ${isNew ? "" : `<button type="button" class="danger" id="fDel">Delete</button>`}
      <span class="sp"></span>
      <button type="button" id="fCancel">Cancel</button>
      <button type="button" class="primary" id="fSave">Save</button>
    </div>`, root => {
    bindCustomPicker(root);
    const ong = root.querySelector("#fOngoing"), end = root.querySelector("#fEnd");
    ong.addEventListener("change", () => { end.disabled = ong.checked; });
    const kindIsMs = () => root.querySelector('input[name=kind]:checked').value === "milestone";
    const syncKind = () => {
      const m = kindIsMs();
      root.querySelector("#fTitle").textContent = (isNew ? "New " : "Edit ") + (m ? "milestone" : "event");
      root.querySelector("#fStartLbl").textContent = m ? "Date" : "Start";
      root.querySelector("#fEndWrap").style.visibility = m ? "hidden" : "";
      root.querySelector("#fOngoingWrap").hidden = m;
      root.querySelector("#fName").placeholder = m ? "e.g. Got married, First marathon" : "e.g. Kansas City, Finance Manager";
    };
    root.querySelectorAll('input[name=kind]').forEach(r => r.addEventListener("change", syncKind));
    syncKind();
    root.querySelector("#fCancel").onclick = closeDialog;
    root.querySelector("#fDel")?.addEventListener("click", () => {
      if (!confirm(`Delete "${e.name}"?`)) return;
      saver.snapshot(`Before deleting "${e.name}"`);
      c.events = c.events.filter(x => x.id !== e.id);
      closeDialog(); commit();
    });
    root.querySelector("#fSave").onclick = () => {
      const name = root.querySelector("#fName").value.trim();
      const s = root.querySelector("#fStart").value;
      const m = kindIsMs();
      const en = m || ong.checked ? "" : end.value;
      const err = root.querySelector("#fErr");
      if (!name) return err.textContent = "Give it a name.";
      if (!isISO(s)) return err.textContent = m ? "Pick the date." : "Pick a start date.";
      if (!m && !ong.checked && !isISO(en)) return err.textContent = "Pick an end date, or tick Still going.";
      if (en && en < s) return err.textContent = "End date is before the start date.";
      const now = new Date().toISOString();
      const target = ev || { id:newId(), calendar:c.calendar.id, createdAt:now };
      Object.assign(target, { name, startDate:s, color:readColor(root), updatedAt:now });
      if (m) target.type = "milestone"; else delete target.type;
      if (en) target.endDate = en; else delete target.endDate;
      if (!ev) c.events.push(target);
      closeDialog(); commit();
    };
    if (isNew) root.querySelector("#fName").focus();
  });
}

function openWeekDialog(i){
  const p = state.paint, c = cal();
  const year = Math.floor(i / WEEKS), week = i % WEEKS;
  const { start, end } = cellRange(year, week, p.b);
  const diff = Math.round((start - (p.nowIdx >= 0 ? cellRange(Math.floor(p.nowIdx/WEEKS), p.nowIdx%WEEKS, p.b).start : p.today)) / 7);
  const rel = i === p.nowIdx ? "This week" : diff < 0 ? `${(-diff).toLocaleString()} weeks ago` : `${diff.toLocaleString()} weeks from now`;
  const evs = [...(p.marks[i] || []), ...(p.cells[i] || [])];
  openDialog(`
    <h2>Age ${year} · Week ${week + 1}</h2>
    <p class="muted" style="margin:0">${nice(start)} – ${nice(end)} · ${rel}</p>
    <div style="margin-top:12px">${evs.map(e => `
      <div class="ev-row"><i class="${dotCls(e)}" style="background:${colorHex(e.color)}"></i>
        <div class="grow"><b>${esc(e.name)}</b><br><span class="muted">${isMilestone(e) ? "Milestone · " : ""}${eventWhen(e, nice)}</span></div>
        ${state.viewOnly ? "" : `<button type="button" data-edit="${esc(e.id)}">Edit</button>`}
      </div>`).join("") || `<p class="muted">Nothing recorded for this week in ${esc(c.calendar.name)}.</p>`}
    </div>
    <div class="nav-week" aria-label="Move to another week">
      <button type="button" data-jump="-52" ${i - 52 < 0 ? "disabled" : ""}>‹ Year</button>
      <button type="button" data-jump="-1" ${i - 1 < 0 ? "disabled" : ""}>‹ Week</button>
      <button type="button" data-jump="now" ${p.nowIdx < 0 || p.nowIdx >= p.total ? "disabled" : ""}>Today</button>
      <button type="button" data-jump="1" ${i + 1 >= p.total ? "disabled" : ""}>Week ›</button>
      <button type="button" data-jump="52" ${i + 52 >= p.total ? "disabled" : ""}>Year ›</button>
    </div>
    <div class="btns">
      <span class="sp"></span>
      <button type="button" id="wClose">Close</button>
      ${state.viewOnly ? "" : `<button type="button" id="wMs">Add milestone</button><button type="button" class="primary" id="wAdd">Add event from here</button>`}
    </div>`, root => {
    // Milestone date defaults to today when this is the current week, otherwise the week's first day.
    const msDate = i === p.nowIdx ? iso(p.today) : iso(start);
    root.querySelector("#wMs")?.addEventListener("click", () => openEventDialog(null, { start:msDate, milestone:true }));
    root.querySelector("#wClose").onclick = closeDialog;
    root.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => {
      const j = b.dataset.jump;
      const next = j === "now" ? p.nowIdx : i + Number(j);
      if (next >= 0 && next < p.total) openWeekDialog(next);
    });
    root.querySelector("#wAdd")?.addEventListener("click", () => openEventDialog(null, { start:iso(start) }));
    root.querySelectorAll("[data-edit]").forEach(b => b.onclick = () =>
      openEventDialog(c.events.find(e => e.id === b.dataset.edit)));
  });
}

function openCalendarDialog(isNew){
  const c = isNew ? null : cal();
  const k = c ? c.calendar : { name:"", length:90, startDate:state.data.preferences.birthdate, color:{kind:"preset",name:"slate"}, displayEventLabels:true, displayCalendarName:true };
  openDialog(`
    <h2>${isNew ? "New calendar" : "Calendar settings"}</h2>
    <label>Name<input type="text" id="cName" value="${esc(k.name)}" placeholder="e.g. Work, Where I have lived, Relationships"></label>
    <div class="row2">
      <label>Length (years)<input type="number" id="cLen" min="1" max="120" value="${k.length}"></label>
      <label>Starts on<input type="date" id="cStart" value="${esc(k.startDate)}"></label>
    </div>
    <label>Color</label>${swatchesHTML(k.color)}
    <label class="check"><input type="checkbox" id="cLabels" ${k.displayEventLabels !== false ? "checked" : ""}> Show event labels beside the grid</label>
    <label class="check"><input type="checkbox" id="cTitle" ${k.displayCalendarName !== false ? "checked" : ""}> Show calendar name as title</label>
    <p class="err" id="cErr"></p>
    <div class="btns">
      ${isNew ? "" : `<button type="button" class="danger" id="cDel">Delete calendar</button>`}
      <span class="sp"></span>
      <button type="button" id="cCancel">Cancel</button>
      <button type="button" class="primary" id="cSave">Save</button>
    </div>`, root => {
    bindCustomPicker(root);
    root.querySelector("#cCancel").onclick = closeDialog;
    root.querySelector("#cDel")?.addEventListener("click", () => {
      if (!confirm(`Delete "${k.name}" and its ${c.events.length} events? This can't be undone (unless you exported a backup).`)) return;
      saver.snapshot(`Before deleting "${k.name}"`);
      state.data.calendars.splice(state.active, 1);
      state.active = Math.max(0, state.active - 1);
      closeDialog(); commit();
    });
    root.querySelector("#cSave").onclick = () => {
      const name = root.querySelector("#cName").value.trim();
      const start = root.querySelector("#cStart").value;
      const err = root.querySelector("#cErr");
      if (!name) return err.textContent = "Give the calendar a name.";
      if (!isISO(start)) return err.textContent = "Pick a start date (usually your birthday).";
      const target = c || blankCalendar(name, "slate");
      Object.assign(target.calendar, {
        name, startDate:start,
        length: clampInt(root.querySelector("#cLen").value, 1, 120, 90),
        color: readColor(root),
        displayEventLabels: root.querySelector("#cLabels").checked,
        displayCalendarName: root.querySelector("#cTitle").checked,
        updatedAt: new Date().toISOString()
      });
      if (!c){ state.data.calendars.push(target); state.active = state.data.calendars.length - 1; }
      closeDialog(); commit();
    };
    root.querySelector("#cName").focus();
  });
}

function openSettings(){
  const p = state.data?.preferences || { birthdate:"", timezone:defaultTZ() };
  openDialog(`
    <h2>Settings</h2>
    <label>Birthdate<input type="date" id="sBirth" value="${esc(p.birthdate || "")}"></label>
    <label>Time zone<input type="text" id="sTz" value="${esc(p.timezone || defaultTZ())}" placeholder="America/Chicago"></label>
    <p class="muted" style="font-size:12px">Changing your birthdate also moves any calendar that started on the old one.</p>
    ${state.data ? `<p style="margin:12px 0 0"><button type="button" id="sSaving">Saving &amp; backups…</button></p>` : ""}
    <p class="err" id="sErr"></p>
    <div class="btns">
      ${state.data ? `<button type="button" class="danger" id="sWipe">Erase all data</button>` : ""}
      <span class="sp"></span>
      <button type="button" id="sCancel">Cancel</button>
      <button type="button" class="primary" id="sSave">Save</button>
    </div>`, root => {
    root.querySelector("#sCancel").onclick = closeDialog;
    root.querySelector("#sSaving")?.addEventListener("click", openSaving);
    root.querySelector("#sWipe")?.addEventListener("click", () => {
      if (!confirm("Erase every calendar and restore point stored in this browser? Download a backup first if you want a copy.")) return;
      store.del(STORAGE_KEY); store.del(SNAP_KEY); store.del(META_KEY);
      saver.meta = { lastSaved:0, lastBackup:0, lastChange:0, persisted:saver.meta.persisted };
      saver.unlinkFile();
      state.data = null; state.active = 0; closeDialog(); render();
    });
    root.querySelector("#sSave").onclick = () => {
      const b = root.querySelector("#sBirth").value, tz = root.querySelector("#sTz").value.trim() || defaultTZ();
      const err = root.querySelector("#sErr");
      if (!isISO(b)) return err.textContent = "Pick your birthdate.";
      try { new Intl.DateTimeFormat("en", { timeZone:tz }); } catch { return err.textContent = "Unknown time zone. Try something like America/Chicago."; }
      if (!state.data){ startFresh(b, tz); closeDialog(); return; }
      const old = state.data.preferences.birthdate;
      state.data.preferences.birthdate = b; state.data.preferences.timezone = tz;
      state.data.calendars.forEach(c => { if (c.calendar.startDate === old) c.calendar.startDate = b; });
      closeDialog(); commit();
    };
  });
}

function startFresh(birthdate, tz){
  state.data = { format:"lifecalendar.io", version:1, exportedAt:new Date().toISOString(),
    preferences:{ birthdate, timezone:tz, displayPrecision:"week" }, calendars:[] };
  state.data.calendars.push(blankCalendar("Where I have lived", "slate"));
