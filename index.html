/* ---------- phone wallpaper ---------- */
const DEVICES = [
  { id:"1320x2868", label:"iPhone 16 Pro Max · 17 Pro Max", w:1320, h:2868 },
  { id:"1206x2622", label:"iPhone 16 Pro · 17 · 17 Pro", w:1206, h:2622 },
  { id:"1260x2736", label:"iPhone Air", w:1260, h:2736 },
  { id:"1290x2796", label:"iPhone 14 Pro Max · 15 Plus · 15 Pro Max · 16 Plus", w:1290, h:2796 },
  { id:"1179x2556", label:"iPhone 14 Pro · 15 · 15 Pro · 16", w:1179, h:2556 },
  { id:"1170x2532", label:"iPhone 12 · 13 · 14", w:1170, h:2532 },
  { id:"1080x2340", label:"iPhone 12 mini · 13 mini", w:1080, h:2340 },
  { id:"750x1334",  label:"iPhone SE", w:750, h:1334 },
  { id:"1080x2400", label:"Android (1080 × 2400)", w:1080, h:2400 }
];
const WP_THEMES = {
  dark:     { bg:"#0c0a09", ink:"#f5f5f4", muted:"#8a837e", lived:"#3d3835", future:"#252220", now:"#ef4444" },
  midnight: { bg:"#0b1220", ink:"#e8edf7", muted:"#7f8aa3", lived:"#2c3650", future:"#151d2e", now:"#f59e0b" },
  light:    { bg:"#f6f4f1", ink:"#1c1917", muted:"#857d77", lived:"#cfcac5", future:"#e8e4e0", now:"#ef4444" },
  sand:     { bg:"#efe6d8", ink:"#3b2f25", muted:"#8c7b69", lived:"#c9b8a2", future:"#e3d7c5", now:"#c2410c" }
};
const WP_KEY = "life-in-weeks:wallpaper";

function guessDevice(){
  const w = Math.round(screen.width * (window.devicePixelRatio || 1));
  const h = Math.round(screen.height * (window.devicePixelRatio || 1));
  const hit = DEVICES.find(d => (d.w === w && d.h === h) || (d.w === h && d.h === w));
  return hit ? hit.id : "1206x2622";
}

function wallpaperOptions(){
  let saved = {};
  try { saved = JSON.parse(store.get(WP_KEY) || "{}"); } catch {}
  return Object.assign({ device:guessDevice(), layout:"lock", theme:"dark", title:true, legend:true, stats:true, caption:"" }, saved, { cal:state.active });
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function drawWallpaper(canvas, o){
  const dev = DEVICES.find(d => d.id === o.device) || DEVICES[1];
  const W = dev.w, H = dev.h, T = WP_THEMES[o.theme] || WP_THEMES.dark;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const c = state.data.calendars[o.cal] || cal();
  const p = paint(c);
  const rows = c.calendar.length;
  const u = W / 1179;                      // scale unit relative to a typical iPhone width
  // Prefer the phone's system font; fall back to a plain stack if the canvas rejects it.
  const font = (px, weight = 600) => {
    const size = `${weight} ${Math.round(px * u)}px`;
    ctx.font = `${size} system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif`;
    if (!ctx.font.includes(`${Math.round(px * u)}px`)) ctx.font = `${size} "Helvetica Neue", Helvetica, Arial, sans-serif`;
    return ctx.font;
  };
  const spaced = (px) => { if ("letterSpacing" in ctx) ctx.letterSpacing = `${(px * u).toFixed(1)}px`; };

  ctx.fillStyle = T.bg; ctx.fillRect(0, 0, W, H);

  // Lock screen keeps the clock (top ~32%) and the flashlight/camera row (bottom ~11%) clear.
  const top = o.layout === "lock" ? H * 0.33 : H * 0.10;
  const bottomPad = o.layout === "lock" ? H * 0.115 : H * 0.12;

  // Legend: unique events in this calendar, oldest first.
  const seen = new Set(), legend = [];
  [...c.events].sort((a, z) => a.startDate.localeCompare(z.startDate)).forEach(e => {
    const k = e.name + "|" + colorHex(e.color);
    if (!seen.has(k)){ seen.add(k); legend.push({ name:e.name, hex:colorHex(e.color), ms:isMilestone(e) }); }
  });

  // Lay out the legend into lines to know its height.
  const legendFont = 30, dot = 18 * u, gapX = 34 * u, lineH = 50 * u;
  const maxLineW = W * 0.84;
  const lines = [];
  if (o.legend && legend.length){
    ctx.font = font(legendFont, 600); spaced(1.5);
    let line = [], lw = 0;
    for (const it of legend){
      const label = it.name.toUpperCase();
      const w = dot + 12 * u + ctx.measureText(label).width;
      if (line.length && lw + gapX + w > maxLineW){ lines.push({ items:line, w:lw }); line = []; lw = 0; }
      lw += (line.length ? gapX : 0) + w; line.push({ ...it, label, w });
    }
    if (line.length) lines.push({ items:line, w:lw });
    if (lines.length > 3) lines.length = 3;
  }

  const titleH = o.title ? 78 * u : 0;
  const statsH = o.stats && p.nowIdx >= 0 ? 64 * u : 0;
  const captionH = o.caption ? 60 * u : 0;
  const legendH = lines.length ? lines.length * lineH + 26 * u : 0;
  const gridAvailH = H - top - bottomPad - titleH - statsH - captionH - legendH;
  const pitch = Math.max(2, Math.min((W * 0.84) / 52, gridAvailH / rows));
  const cell = pitch * 0.76, rad = cell * 0.24;
  const gridW = pitch * 52 - (pitch - cell), gridH = pitch * rows - (pitch - cell);
  const x0 = (W - gridW) / 2;

  // Center the whole block vertically inside the free area.
  const blockH = titleH + gridH + statsH + captionH + legendH;
  let y = top + Math.max(0, (H - top - bottomPad - blockH) / 2);

  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  if (o.title){
    ctx.fillStyle = T.ink; ctx.font = font(34, 700); spaced(8);
    ctx.fillText(c.calendar.name.toUpperCase(), W / 2, y + 40 * u);
    y += titleH;
  }

  for (let r = 0; r < rows; r++){
    for (let w = 0; w < 52; w++){
      const i = r * 52 + w;
      const evs = p.cells[i];
      const x = x0 + w * pitch, yy = y + r * pitch;
      if (evs){
        const a = colorHex(evs[evs.length - 1].color);
        if (evs.length > 1){
          const g = ctx.createLinearGradient(x, yy, x + cell, yy + cell);
          const b = colorHex(evs[0].color);
          g.addColorStop(0, b); g.addColorStop(.5, b); g.addColorStop(.5, a); g.addColorStop(1, a);
          ctx.fillStyle = g;
        } else ctx.fillStyle = a;
        if (i > p.nowIdx) ctx.globalAlpha = 0.35;   // planned future events read lighter
      } else {
        ctx.fillStyle = i < p.nowIdx ? T.lived : T.future;
      }
      roundRect(ctx, x, yy, cell, cell, rad); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  // Milestones: a dot slightly larger than the square, ringed in the background color so it reads on any fill.
  for (let i = 0; i < p.total; i++){
    const mk = p.marks[i]; if (!mk) continue;
    const r = Math.floor(i / 52), w = i % 52;
    const cx = x0 + w * pitch + cell / 2, cy = y + r * pitch + cell / 2, rr = cell * 0.72;
    ctx.beginPath(); ctx.arc(cx, cy, rr + Math.max(1.5, 2.5 * u), 0, Math.PI * 2); ctx.fillStyle = T.bg; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fillStyle = colorHex(mk[mk.length - 1].color); ctx.fill();
  }
  if (p.nowIdx >= 0 && p.nowIdx < p.total){
    const r = Math.floor(p.nowIdx / 52), w = p.nowIdx % 52;
    const x = x0 + w * pitch, yy = y + r * pitch, pad = Math.max(2, pitch * 0.22);
    ctx.fillStyle = T.now; roundRect(ctx, x, yy, cell, cell, rad); ctx.fill();
    ctx.strokeStyle = T.now; ctx.lineWidth = Math.max(2, 3 * u);
    roundRect(ctx, x - pad, yy - pad, cell + pad * 2, cell + pad * 2, rad + pad); ctx.stroke();
  }
  y += gridH;

  if (statsH){
    const lived = p.nowIdx + 1, pct = (lived / p.total * 100).toFixed(1);
    ctx.fillStyle = T.muted; ctx.font = font(28, 600); spaced(2);
    ctx.fillText(`WEEK ${lived.toLocaleString()} OF ${p.total.toLocaleString()}  ·  ${pct}%`, W / 2, y + 48 * u);
    y += statsH;
  }
  if (captionH){
    ctx.fillStyle = T.ink; ctx.font = font(32, 500); spaced(0.5);
    ctx.fillText(o.caption, W / 2, y + 44 * u, W * 0.86);
    y += captionH;
  }
  if (lines.length){
    y += 26 * u;
    ctx.font = font(legendFont, 600); spaced(1.5); ctx.textAlign = "left"; ctx.textBaseline = "middle";
    for (const ln of lines){
      let x = (W - ln.w) / 2;
      const cy = y + lineH / 2;
      for (const it of ln.items){
        ctx.fillStyle = it.hex; ctx.beginPath();
        if (it.ms){ const q = dot * 0.6; ctx.moveTo(x + dot / 2, cy - q); ctx.lineTo(x + dot / 2 + q, cy); ctx.lineTo(x + dot / 2, cy + q); ctx.lineTo(x + dot / 2 - q, cy); ctx.closePath(); }
        else ctx.arc(x + dot / 2, cy, dot / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = T.ink; ctx.fillText(it.label, x + dot + 12 * u, cy + 1);
        x += it.w + gapX;
      }
      y += lineH;
    }
  }
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  return dev;
}

function openWallpaper(){
  const o = wallpaperOptions();
  const cals = state.data.calendars;
  const radio = (name, val, label) => `<label><input type="radio" name="${name}" value="${val}" ${o[name] === val ? "checked" : ""}><span>${label}</span></label>`;
  openDialog(`
    <h2>Phone wallpaper</h2>
    <p class="muted" style="margin:0">A snapshot of this week. Make a fresh one every so often to watch it fill in.</p>
    <div class="wp-wrap">
      <div>
        ${cals.length > 1 ? `<label>Calendar<select id="wpCal">${cals.map((c, i) => `<option value="${i}" ${i === o.cal ? "selected" : ""}>${esc(c.calendar.name)}</option>`).join("")}</select></label>` : ""}
        <label>Phone<select id="wpDevice">${DEVICES.map(d => `<option value="${d.id}" ${d.id === o.device ? "selected" : ""}>${d.label}</option>`).join("")}</select></label>
        <label>Made for</label>
        <div class="seg">${radio("layout", "lock", "Lock screen")}${radio("layout", "home", "Home screen")}</div>
        <label>Style</label>
        <div class="theme-row">${Object.entries(WP_THEMES).map(([k, t]) =>
          `<label title="${k}"><input type="radio" name="theme" value="${k}" ${o.theme === k ? "checked" : ""}><span style="background:linear-gradient(135deg,${t.bg} 55%,${t.lived} 55%)"></span></label>`).join("")}</div>
        <label class="check"><input type="checkbox" id="wpTitle" ${o.title ? "checked" : ""}> Calendar name</label>
        <label class="check"><input type="checkbox" id="wpStats" ${o.stats ? "checked" : ""}> Week count</label>
        <label class="check"><input type="checkbox" id="wpLegend" ${o.legend ? "checked" : ""}> Color legend</label>
        <label>Caption (optional)<input type="text" id="wpCaption" maxlength="60" value="${esc(o.caption)}" placeholder="Make the weeks count"></label>
      </div>
      <div class="wp-preview">
        <img id="wpImg" alt="Wallpaper preview">
        <p id="wpHint">On iPhone, tap Save, then "Save Image". Or press and hold the preview.</p>
      </div>
    </div>
    <div class="btns">
      <span class="sp"></span>
      <button type="button" id="wpClose">Close</button>
      <button type="button" class="primary" id="wpSave">Save</button>
    </div>`, root => {
    const canvas = document.createElement("canvas");
    let blob = null, url = null, dev = null, timer;
    const read = () => {
      o.cal = root.querySelector("#wpCal") ? +root.querySelector("#wpCal").value : state.active;
      o.device = root.querySelector("#wpDevice").value;
      o.layout = root.querySelector('input[name=layout]:checked').value;
      o.theme = root.querySelector('input[name=theme]:checked').value;
      o.title = root.querySelector("#wpTitle").checked;
      o.stats = root.querySelector("#wpStats").checked;
      o.legend = root.querySelector("#wpLegend").checked;
      o.caption = root.querySelector("#wpCaption").value.trim();
      const { cal:_, ...keep } = o; store.set(WP_KEY, JSON.stringify(keep));
    };
    const redraw = () => {
      read();
      dev = drawWallpaper(canvas, o);
      root.querySelector("#wpImg").style.setProperty("--ar", `${dev.w}/${dev.h}`);
      canvas.toBlob(b => {
        blob = b;
        if (url) URL.revokeObjectURL(url);
        url = URL.createObjectURL(b);
        root.querySelector("#wpImg").src = url;
      }, "image/png");
    };
    root.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(redraw, 120); });
    root.addEventListener("change", () => { clearTimeout(timer); redraw(); });
    root.querySelector("#wpClose").onclick = closeDialog;
    root.querySelector("#wpSave").onclick = async () => {
      if (!blob) return;
      const c = state.data.calendars[o.cal] || cal();
      const name = `life-in-weeks-${c.calendar.name.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${iso(today())}.png`;
      const file = new File([blob], name, { type:"image/png" });
      if (navigator.canShare && navigator.canShare({ files:[file] })){
        try { await navigator.share({ files:[file] }); return; }
        catch (err){ if (err && err.name === "AbortError") return; }
      }
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    };
    redraw();
  }, { wide:true });
}

/* ==================================================================
   Saving mode
   - Autosave to this browser (localStorage) on every change
   - Restore points: rolling snapshots + one before every risky action
   - Asks the browser to keep data from being cleared (Storage API)
   - Optional: keep a backup file on disk updated automatically
     (File System Access API, Chrome/Edge desktop)
   - Backup reminder when changes haven't been exported in a while
   ================================================================== */
const META_KEY = "life-in-weeks:meta";
const SNAP_KEY = "life-in-weeks:snapshots";
const SNAP_MAX = 15;
const SNAP_EVERY = 10 * 60 * 1000;          // rolling snapshot at most every 10 minutes
const REMIND_AFTER = 30 * DAY;              // nudge to back up after 30 days of unbacked changes

const idb = {
  open(){
    return new Promise((res, rej) => {
      if (!("indexedDB" in window)) return rej(new Error("no idb"));
      const r = indexedDB.open("life-in-weeks", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async get(k){ try { const db = await this.open(); return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch { return undefined; } },
  async set(k, v){ try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch { return false; } },
  async del(k){ try { const db = await this.open(); await new Promise(res => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").delete(k); t.oncomplete = res; t.onerror = res; }); } catch {} }
};

const saver = {
  meta:{ lastSaved:0, lastBackup:0, lastChange:0, persisted:null },
  ok:true,
  fileHandle:null,      // FileSystemFileHandle when a backup file is linked
  filePerm:"none",      // none | granted | prompt
  fileName:"",
  lastFileWrite:0,
  fileTimer:null,

  loadMeta(){
    try { Object.assign(this.meta, JSON.parse(store.get(META_KEY) || "{}")); } catch {}
  },
  saveMeta(){ store.set(META_KEY, JSON.stringify(this.meta)); },

  snapshots(){
    try { const s = JSON.parse(store.get(SNAP_KEY) || "[]"); return Array.isArray(s) ? s : []; } catch { return []; }
  },
  writeSnapshots(list){
    // If storage is tight, drop the oldest restore points until it fits.
    while (list.length){
      if (store.set(SNAP_KEY, JSON.stringify(list))) return true;
      list.shift();
    }
    store.del(SNAP_KEY); return false;
  },
  summarize(d){
    const cals = d?.calendars || [];
    const ev = cals.reduce((s, c) => s + (c.events?.length || 0), 0);
    return `${cals.length} calendar${cals.length === 1 ? "" : "s"} · ${ev} event${ev === 1 ? "" : "s"}`;
  },
  // Take a restore point. reason = null for the rolling autosave snapshot.
  snapshot(reason, json){
    json = json || (state.data ? JSON.stringify(state.data) : null);
    if (!json) return;
    const list = this.snapshots();
    const last = list[list.length - 1];
    if (last && last.data === json){                   // same content: just relabel with the more specific reason
      if (reason){ last.reason = reason; last.at = Date.now(); this.writeSnapshots(list); }
      return;
    }
    list.push({ at:Date.now(), reason:reason || "Autosave", summary:this.summarize(JSON.parse(json)), data:json });
    while (list.length > SNAP_MAX) list.shift();
    this.writeSnapshots(list);
  },
  afterSave(json, ok){
    this.ok = ok;
    if (ok){
      const now = Date.now();
      this.meta.lastSaved = now; this.meta.lastChange = now; this.saveMeta();
      const list = this.snapshots(), last = list[list.length - 1];
      if (!last || now - last.at > SNAP_EVERY) this.snapshot(null, json);
      // Ask once for durable storage, now that there's data worth keeping.
      if (this.meta.persisted === false && !this.meta.persistAsked){
        this.meta.persistAsked = true; this.saveMeta(); this.requestPersist();
      }
    }
    this.queueFileWrite(json);
    this.renderStatus();
  },

  /* ---- protect from automatic clearing ---- */
  async checkPersisted(){
    try { this.meta.persisted = navigator.storage?.persisted ? await navigator.storage.persisted() : null; }
    catch { this.meta.persisted = null; }
    return this.meta.persisted;
  },
  async requestPersist(){
    try { this.meta.persisted = navigator.storage?.persist ? await navigator.storage.persist() : null; }
    catch { this.meta.persisted = null; }
    this.saveMeta(); this.renderStatus();
    return this.meta.persisted;
  },

  /* ---- linked backup file (Chromium desktop) ---- */
  fileSupported(){ return "showSaveFilePicker" in window && window.isSecureContext; },
  async restoreFileLink(){
    if (!this.fileSupported()) return;
    const h = await idb.get("backupFile");
    if (!h) return;
    this.fileHandle = h; this.fileName = h.name;
    try { this.filePerm = (await h.queryPermission({ mode:"readwrite" })) === "granted" ? "granted" : "prompt"; }
    catch { this.filePerm = "prompt"; }
    this.renderStatus();
  },
  async linkFile(){
    try {
      const h = await window.showSaveFilePicker({
        suggestedName:"life-in-weeks-backup.json",
        types:[{ description:"Life in Weeks backup", accept:{ "application/json":[".json"] } }]
      });
      this.fileHandle = h; this.fileName = h.name; this.filePerm = "granted";
      await idb.set("backupFile", h);
      await this.writeFile(JSON.stringify(state.data));
      return true;
    } catch (e){
      if (e && e.name !== "AbortError") alert("Couldn't link that file: " + (e.message || e));
      return false;
    }
  },
  async reconnectFile(){
    if (!this.fileHandle) return false;
    try {
      const p = await this.fileHandle.requestPermission({ mode:"readwrite" });
      this.filePerm = p === "granted" ? "granted" : "prompt";
      if (this.filePerm === "granted" && state.data) await this.writeFile(JSON.stringify(state.data));
    } catch { this.filePerm = "prompt"; }
    this.renderStatus();
    return this.filePerm === "granted";
  },
  async unlinkFile(){
    this.fileHandle = null; this.fileName = ""; this.filePerm = "none";
    await idb.del("backupFile"); this.renderStatus();
  },
  queueFileWrite(json){
    if (!this.fileHandle || this.filePerm !== "granted") return;
    clearTimeout(this.fileTimer);
    this.fileTimer = setTimeout(() => this.writeFile(json), 1500);
  },
  async writeFile(json){
    if (!this.fileHandle || !json) return;
    try {
      const out = JSON.stringify(Object.assign(JSON.parse(json), { exportedAt:new Date().toISOString() }), null, 2);
      const w = await this.fileHandle.createWritable();
      await w.write(out); await w.close();
      this.lastFileWrite = Date.now();
      this.meta.lastBackup = Date.now(); this.saveMeta();
    } catch (e){
      this.filePerm = "prompt";
    }
    this.renderStatus();
  },

  /* ---- status pill ---- */
  needsBackup(){
    if (!state.data || this.fileHandle) return false;
    const changedSinceBackup = this.meta.lastChange > (this.meta.lastBackup || 0);
    const since = this.meta.lastBackup || this.firstChange();
    return changedSinceBackup && Date.now() - since > REMIND_AFTER;
  },
  firstChange(){ const s = this.snapshots()[0]; return s ? s.at : this.meta.lastChange; },
  renderStatus(){
    const el = $("saveStatus"); if (!el) return;
    if (state.viewOnly || !state.data){ el.hidden = true; return; }
    el.hidden = false;
    let cls = "ok", text = "Saved", title = "Saved in this browser";
    if (!this.ok){ cls = "bad"; text = "Not saving"; title = "This browser is blocking storage. Export a backup."; }
    else if (this.fileHandle && this.filePerm === "prompt"){ cls = "warn"; text = "Reconnect file"; title = "Allow access again to keep your backup file updated"; }
    else if (this.needsBackup()){ cls = "warn"; text = "Back up"; title = "You have changes that aren't in a backup file yet"; }
    else if (this.fileHandle){ text = "Saved + file"; title = `Saved in this browser and to ${this.fileName}`; }
    el.className = "save-pill " + cls;
    el.innerHTML = `<i></i><span>${text}</span>`;
    el.title = title + (this.meta.lastSaved ? ` · last change ${ago(this.meta.lastSaved)}` : "");
  }
};

function ago(t){
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 45) return "just now";
  const m = Math.round(s / 60); if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h} hr${h === 1 ? "" : "s"} ago`;
  const d = Math.round(h / 24); if (d < 31) return `${d} day${d === 1 ? "" : "s"} ago`;
  return new Date(t).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
}
const isIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia?.("(display-mode: standalone)").matches || navigator.standalone === true;

function openSaving(){
  const m = saver.meta, snaps = saver.snapshots().slice().reverse();
  const persistedRow = m.persisted === true
    ? `<span class="ok-txt">Protected.</span> Your browser won't clear it on its own.`
    : m.persisted === false
      ? `Your browser may clear site data it thinks is unused. <button type="button" id="svPersist" class="link">Ask to keep it</button>`
      : `This browser doesn't say whether it keeps site data long term. Back up now and then.`;
  const iosTip = isIOS() && !isStandalone()
    ? `<p class="note">On iPhone, Safari can erase a website's saved data after about a week without a visit. <b>Add this app to your Home Screen</b> (Share → Add to Home Screen) so your calendars are kept.</p>` : "";
  const fileBlock = !saver.fileSupported() ? "" : saver.fileHandle
    ? `<div class="sv-row"><div class="grow"><b>Backup file</b><br><span class="muted">${esc(saver.fileName)} · ${saver.filePerm === "granted" ? (saver.lastFileWrite ? `updated ${ago(saver.lastFileWrite)}` : "linked") : "needs permission again"}</span></div>
         ${saver.filePerm !== "granted" ? `<button type="button" id="svReconnect" class="primary">Reconnect</button>` : ""}
         <button type="button" id="svUnlink">Unlink</button></div>`
    : `<div class="sv-row"><div class="grow"><b>Keep a backup file updated</b><br><span class="muted">Pick a file on this computer (iCloud Drive, Dropbox or OneDrive folders work too). Every change is written to it automatically.</span></div>
         <button type="button" id="svLink">Choose file</button></div>`;
  openDialog(`
    <h2>Saving</h2>
    <div class="sv-row"><span class="sv-dot ${saver.ok ? "ok" : "bad"}"></span>
      <div class="grow"><b>${saver.ok ? "Autosave is on" : "This browser isn't saving"}</b><br>
      <span class="muted">${saver.ok
        ? `Every change is saved in this browser on this device${m.lastSaved ? `, last ${ago(m.lastSaved)}` : ""}. Nothing is uploaded.`
        : `Private browsing or blocked storage. Download a backup before you close this tab.`}</span></div></div>
    ${saver.ok ? `<p class="muted" style="font-size:13px;margin:6px 0 0">${persistedRow}</p>` : ""}
    ${iosTip}
    <h3>Backups</h3>
    <div class="sv-row"><div class="grow"><b>Download a backup</b><br><span class="muted">${m.lastBackup ? `Last backup ${ago(m.lastBackup)}` : "No backup yet"}. Use it to move to another device, too.</span></div>
      <button type="button" id="svExport" class="${saver.needsBackup() || !m.lastBackup ? "primary" : ""}">Download</button></div>
    ${fileBlock}
    <h3>Restore points</h3>
    <p class="muted" style="font-size:13px;margin:0 0 4px">Saved automatically as you work and before imports, restores and deletes. Kept in this browser only.</p>
    <div class="snap-list">${snaps.length ? snaps.map((s, k) => `
      <div class="sv-row"><div class="grow"><b>${esc(s.reason)}</b><br><span class="muted">${new Date(s.at).toLocaleString(undefined, { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" })} · ${esc(s.summary)}</span></div>
        <button type="button" data-restore="${snaps.length - 1 - k}">Restore</button></div>`).join("")
      : `<p class="muted">None yet. They appear as you make changes.</p>`}</div>
    <div class="btns"><span class="sp"></span><button type="button" id="svClose">Done</button></div>`, root => {
    root.querySelector("#svClose").onclick = closeDialog;
    root.querySelector("#svExport").onclick = () => { exportJSON(); openSaving(); };
    root.querySelector("#svPersist")?.addEventListener("click", async () => {
      const r = await saver.requestPersist();
      if (r === false) alert("The browser declined for now. Browsers usually allow it once a site is installed or used regularly. Adding it to your Home Screen or bookmarking it helps.");
      openSaving();
    });
    root.querySelector("#svLink")?.addEventListener("click", async () => { if (await saver.linkFile()) openSaving(); });
    root.querySelector("#svReconnect")?.addEventListener("click", async () => { await saver.reconnectFile(); openSaving(); });
    root.querySelector("#svUnlink")?.addEventListener("click", async () => { await saver.unlinkFile(); openSaving(); });
    root.querySelectorAll("[data-restore]").forEach(b => b.onclick = () => {
      const s = saver.snapshots()[+b.dataset.restore];
      if (!s) return;
      if (!confirm(`Restore "${s.reason}" from ${new Date(s.at).toLocaleString()}? Your current version is kept as a restore point too.`)) return;
      try {
        const restored = normalize(JSON.parse(s.data));
        saver.snapshot("Before restore");
        state.data = restored; state.active = 0;
        closeDialog(); commit();
      } catch { alert("That restore point couldn't be read."); }
    });
  });
}

/* ---------- import / export / share ---------- */
async function handleFile(file){
  let incoming;
  try { incoming = normalize(JSON.parse(await file.text())); }
  catch (e){ alert(e.message || "Couldn't read that file."); return; }
  const nEv = incoming.calendars.reduce((s,c) => s + c.events.length, 0);
  const summary = `${incoming.calendars.length} calendar${incoming.calendars.length === 1 ? "" : "s"}, ${nEv} events, birthdate ${incoming.preferences.birthdate}`;
  if (!state.data){ state.data = incoming; state.active = 0; commit(); return; }
  openDialog(`
    <h2>Import backup</h2>
    <p class="muted">Found ${esc(summary)}.</p>
    <div class="btns">
      <button type="button" id="iCancel">Cancel</button>
      <span class="sp"></span>
      <button type="button" id="iAdd">Add alongside mine</button>
      <button type="button" class="primary" id="iReplace">Replace everything</button>
    </div>`, root => {
    root.querySelector("#iCancel").onclick = closeDialog;
    root.querySelector("#iReplace").onclick = () => { saver.snapshot("Before import"); state.data = incoming; state.active = 0; closeDialog(); commit(); };
    root.querySelector("#iAdd").onclick = () => {
      saver.snapshot("Before import");
      const ids = new Set(state.data.calendars.map(c => c.calendar.id));
      incoming.calendars.forEach(c => {
        if (ids.has(c.calendar.id)){ c.calendar.id = newId(); c.events.forEach(e => e.calendar = c.calendar.id); }
        state.data.calendars.push(c);
      });
      closeDialog(); commit();
    };
  });
}

function exportJSON(){
  const out = Object.assign({}, state.data, { exportedAt:new Date().toISOString() });
  const blob = new Blob([JSON.stringify(out, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `life-calendars-backup-${iso(today())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  saver.meta.lastBackup = Date.now(); saver.saveMeta(); saver.renderStatus();
}

function b64u(bytes){
  let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unb64u(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "=";
  return Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
}
async function encodeShare(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if ("CompressionStream" in window){
    try {
      const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      return "z" + b64u(new Uint8Array(await new Response(st).arrayBuffer()));
    } catch {}
  }
  return "j" + b64u(bytes);
}
async function decodeShare(s){
  let bytes = unb64u(s.slice(1));
  if (s[0] === "z"){
    const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    bytes = new Uint8Array(await new Response(st).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
function compactForShare(which){
  const pick = which === "all" ? state.data.calendars : [cal()];
  return {
    format:"lifecalendar.io", version:1, preferences:state.data.preferences,
    calendars: pick.map(c => ({
      calendar:{ name:c.calendar.name, color:c.calendar.color, length:c.calendar.length, startDate:c.calendar.startDate,
        displayEventLabels:c.calendar.displayEventLabels, displayCalendarName:c.calendar.displayCalendarName },
      events:c.events.map(e => { const o = { name:e.name, startDate:e.startDate, color:e.color }; if (e.endDate) o.endDate = e.endDate; if (isMilestone(e)) o.type = "milestone"; return o; })
    }))
  };
}
function openShare(){
  openDialog(`
    <h2>Share</h2>
    <p class="muted">Anyone with the link sees a read-only copy. The data lives inside the link itself, so nothing is uploaded, but it does include your birthdate and every event you share.</p>
    <label>What to share<select id="shWhich"><option value="one">Just "${esc(cal().calendar.name)}"</option><option value="all">All calendars</option></select></label>
    <label>Link<textarea id="shLink" readonly></textarea></label>
    <div class="btns"><span class="sp"></span><button type="button" id="shClose">Close</button><button type="button" class="primary" id="shCopy">Copy link</button></div>`, root => {
    const ta = root.querySelector("#shLink"), sel = root.querySelector("#shWhich");
    const build = async () => {
      ta.value = "Building link…";
      ta.value = location.origin + location.pathname + "#v=" + await encodeShare(compactForShare(sel.value));
    };
    sel.onchange = build; build();
    root.querySelector("#shClose").onclick = closeDialog;
    root.querySelector("#shCopy").onclick = async (ev) => {
      try { await navigator.clipboard.writeText(ta.value); ev.target.textContent = "Copied"; }
      catch { ta.select(); ev.target.textContent = "Select and copy"; }
    };
  });
}

function loadLocal(){
  const raw = store.get(STORAGE_KEY);
  if (!raw){ state.data = null; return; }
  try { state.data = normalize(JSON.parse(raw)); } catch { state.data = null; }
}
function leaveShared(){
  history.replaceState(null, "", location.pathname + location.search);
  state.viewOnly = false; state.active = 0; loadLocal(); render();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-tab],[data-ev]");
  if (!t) return;
  if (t.dataset.tab !== undefined){
    state.active = +t.dataset.tab; state.rangeMode = false; state.rangeStart = null; render(); return;
  }
  if (t.dataset.ev !== undefined){
    if (state.viewOnly) return;
    openEventDialog(cal().events.find(x => x.id === t.dataset.ev)); return;
  }
  switch (t.dataset.act){
    case "newcal": openCalendarDialog(true); break;
    case "editcal": openCalendarDialog(false); break;
    case "newev": openEventDialog(null); break;
    case "newms": openEventDialog(null, { start:iso(today()), milestone:true }); break;
    case "range": state.rangeMode = !state.rangeMode; state.rangeStart = null; renderToolbar(); renderGrid(); break;
    case "welcome": openWelcome(); break;
    case "import": $("fileInput").click(); break;
    case "sample": state.data = normalize(JSON.parse(JSON.stringify(SAMPLE))); state.active = 0; commit(); break;
    case "keep": {
      const shared = state.data;
      { const mine = store.get(STORAGE_KEY); if (mine) saver.snapshot("Before adding a shared calendar", mine); }
      history.replaceState(null, "", location.pathname + location.search);
      state.viewOnly = false; loadLocal();
      if (!state.data) state.data = shared;
      else shared.calendars.forEach(c => { c.calendar.id = newId(); c.events.forEach(ev => ev.calendar = c.calendar.id); state.data.calendars.push(c); });
      state.active = 0; commit(); break;
    }
    case "leave": leaveShared(); break;
  }
});

/* Drag to select (mouse / trackpad / pen). Touch keeps scrolling and uses "Select weeks" instead. */
function canDrag(){ return window.matchMedia("(hover: hover) and (pointer: fine)").matches; }
const drag = { from:null, to:null, moved:false, suppressClick:false, tip:null, lit:[] };
function cellIndexAt(x, y){
  const el = document.elementFromPoint(x, y);
  const c = el && el.closest && el.closest("#grid .c");
  return c ? +c.dataset.i : null;
}
function rangeDates(a, z){
  const b = state.paint.b;
  const lo = Math.min(a, z), hi = Math.max(a, z);
  return { s:cellRange(Math.floor(lo/WEEKS), lo%WEEKS, b).start, e:cellRange(Math.floor(hi/WEEKS), hi%WEEKS, b).end, n:hi - lo + 1 };
}
function lightRange(a, z){
  drag.lit.forEach(i => state.cellEls[i]?.classList.remove("rng"));
  drag.lit = [];
  if (a === null) return;
  const lo = Math.min(a, z), hi = Math.max(a, z);
  for (let i = lo; i <= hi; i++){ state.cellEls[i]?.classList.add("rng"); drag.lit.push(i); }
}
function endDrag(){
  lightRange(null);
  $("grid").classList.remove("dragging");
  drag.tip?.remove(); drag.tip = null;
  drag.from = drag.to = null; drag.moved = false;
}
$("grid").addEventListener("pointerdown", e => {
  if (state.viewOnly || state.rangeMode || e.pointerType === "touch" || e.button !== 0) return;
  const cell = e.target.closest(".c"); if (!cell) return;
  drag.from = drag.to = +cell.dataset.i; drag.moved = false;
  e.preventDefault();
});
window.addEventListener("pointermove", e => {
  if (drag.from === null) return;
  const i = cellIndexAt(e.clientX, e.clientY);
  if (i !== null && i !== drag.to){ drag.to = i; }
  if (!drag.moved && drag.to !== drag.from){
    drag.moved = true;
    $("grid").classList.add("dragging");
    drag.tip = document.createElement("div"); drag.tip.className = "drag-tip"; document.body.appendChild(drag.tip);
  }
  if (!drag.moved) return;
  lightRange(drag.from, drag.to);
  const r = rangeDates(drag.from, drag.to);
  drag.tip.textContent = `${monthYr(r.s)} – ${monthYr(r.e)} · ${r.n.toLocaleString()} week${r.n === 1 ? "" : "s"}`;
  drag.tip.style.left = e.clientX + "px"; drag.tip.style.top = e.clientY + "px";
});
window.addEventListener("pointerup", () => {
  if (drag.from === null) return;
  if (drag.moved){
    const r = rangeDates(drag.from, drag.to);
    drag.suppressClick = true;
    setTimeout(() => { drag.suppressClick = false; }, 0);
    endDrag();
    openEventDialog(null, { start:iso(r.s), end:iso(r.e) });
  } else endDrag();
});
window.addEventListener("keydown", e => { if (e.key === "Escape" && drag.from !== null) endDrag(); });
window.addEventListener("blur", () => { if (drag.from !== null) endDrag(); });

$("grid").addEventListener("click", e => {
  if (drag.suppressClick){ drag.suppressClick = false; return; }
  const cell = e.target.closest(".c"); if (!cell) return;
  const i = +cell.dataset.i;
  if (state.rangeMode && !state.viewOnly){
    if (state.rangeStart === null){ state.rangeStart = i; renderToolbar(); cell.classList.add("sel"); return; }
    const a = Math.min(state.rangeStart, i), z = Math.max(state.rangeStart, i);
    const b = state.paint.b;
    const s = cellRange(Math.floor(a/WEEKS), a%WEEKS, b).start, en = cellRange(Math.floor(z/WEEKS), z%WEEKS, b).end;
    state.rangeMode = false; state.rangeStart = null; renderToolbar(); renderGrid();
    openEventDialog(null, { start:iso(s), end:iso(en) });
    return;
  }
  openWeekDialog(i);
});
$("grid").addEventListener("mouseover", e => {
  const cell = e.target.closest(".c"); if (!cell || cell.title) return;
  const i = +cell.dataset.i, p = state.paint;
  const { start } = cellRange(Math.floor(i/WEEKS), i%WEEKS, p.b);
  const names = (p.cells[i] || []).map(x => x.name).join(", ");
  cell.title = `Age ${Math.floor(i/WEEKS)}, week ${i%WEEKS + 1} · ${nice(start)}${names ? " · " + names : ""}`;
});
document.addEventListener("input", e => {
  if (e.target.id !== "zoom") return;
  state.zoom = +e.target.value; store.set(ZOOM_KEY, String(state.zoom));
  renderGrid();
});

$("btnImport").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) handleFile(f); };
$("btnExport").onclick = exportJSON;
$("btnShare").onclick = openShare;
$("btnPrint").onclick = () => window.print();
$("btnSettings").onclick = openSettings;
$("btnWallpaper").onclick = openWallpaper;
$("btnMenu").onclick = openMenu;
$("saveStatus").onclick = async () => {
  if (saver.fileHandle && saver.filePerm === "prompt"){ await saver.reconnectFile(); }
  openSaving();
};
// Refresh the "x min ago" text and backup reminder now and then.
setInterval(() => saver.renderStatus(), 60000);
// Write any pending file save before the tab goes away.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && saver.fileTimer && state.data){ clearTimeout(saver.fileTimer); saver.writeFile(JSON.stringify(state.data)); }
});

let resizeT;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { if (state.zoom === null && cal()) renderGrid(); }, 150);
});
window.addEventListener("hashchange", async () => {
  if (location.hash.startsWith("#v=")) await init();
});

async function init(){
  saver.loadMeta();
  const z = parseInt(store.get(ZOOM_KEY), 10);
  state.zoom = Number.isFinite(z) ? z : null;
  state.viewOnly = false;
  if (location.hash.startsWith("#v=")){
    try { state.data = normalize(await decodeShare(location.hash.slice(3))); state.viewOnly = true; state.active = 0; }
    catch { alert("That share link couldn't be read. It may have been cut off when copied."); history.replaceState(null, "", location.pathname + location.search); }
  }
  if (!state.viewOnly) loadLocal();
  render();
  saver.renderStatus();
  if (!state.viewOnly){
    await saver.checkPersisted();
    if (state.data && saver.meta.persisted === false && !saver.meta.persistAsked){
      saver.meta.persistAsked = true; saver.saveMeta(); saver.requestPersist();
    }
    saver.restoreFileLink();
  }
}
init();

// Offline support: cache the app so it opens without a connection (needs https or localhost).
if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:"){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
